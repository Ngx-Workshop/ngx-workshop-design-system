name: Publish and deploy design system

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngx-workshop-design-system-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.6.0

      - name: Validate frontend deployment settings
        env:
          MFE_DROPLET_IP: ${{ secrets.MFE_DROPLET_IP }}
          MFE_SSH_PRIVATE_KEY: ${{ secrets.MFE_SSH_PRIVATE_KEY }}
          MFE_SSH_HOST_FINGERPRINT: ${{ secrets.MFE_SSH_HOST_FINGERPRINT }}
        run: |
          test -n "$MFE_DROPLET_IP" || { echo "Missing MFE_DROPLET_IP" >&2; exit 1; }
          test -n "$MFE_SSH_PRIVATE_KEY" || { echo "Missing MFE_SSH_PRIVATE_KEY" >&2; exit 1; }
          if [[ ! "$MFE_SSH_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo "MFE_SSH_HOST_FINGERPRINT must contain only the frontend host's SHA256 fingerprint" >&2
            exit 1
          fi

      - name: Install dependencies and test release selection
        run: |
          npm ci
          node --test scripts/prepare-release.test.mjs

      - name: Prepare Angular-aligned package version
        id: release
        run: node scripts/prepare-release.mjs

      - name: Build and verify library, demo, Storybook and package consumer
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'
        run: |
          npm run verify
          test -f dist/storybook/index.html
          test -f dist/storybook/iframe.html

      - name: Publish package using npm trusted publisher
        if: steps.release.outputs.publish == 'true'
        working-directory: dist/ngx-workshop-ui
        # Record the source commit explicitly so retries can detect this release.
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          npm pkg set "gitHead=$RELEASE_SHA"
          npm publish --access public --provenance --registry https://registry.npmjs.org/

      - name: Copy static Storybook to frontend
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          version: '1.8.0'
          host: ${{ secrets.MFE_DROPLET_IP }}
          username: root
          key: ${{ secrets.MFE_SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.MFE_SSH_HOST_FINGERPRINT }}
          source: 'dist/storybook/*'
          target: '/opt/ngx-workshop-design-system/'
          strip_components: 2
          overwrite: true
